<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>rippl — This week</title>
</head>
<body>
  <div id="app">
    <header class="page-header">
      <span class="brand-mark">
        <svg class="brand-icon" width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="3.5" fill="#5C7A52"/>
          <circle cx="16" cy="16" r="8.7" stroke="#5C7A52" stroke-width="2.8" opacity=".65"/>
          <circle cx="16" cy="16" r="14" stroke="#5C7A52" stroke-width="2.2" opacity=".4"/>
        </svg>
        rippl
      </span>
      <span class="page-title">This week</span>
    </header>

    <div id="paused-banner" class="paused-banner hidden">
      <span>Tracking paused</span>
      <button id="btn-resume" class="btn-resume">Resume</button>
    </div>

    <section id="insights-hero" class="insights-hero hidden">
      <div class="hero-number" id="hero-number"></div>
      <div class="hero-seed" id="hero-seed"></div>
      <div class="hero-qualifier" id="hero-qualifier"></div>
      <div class="stat-cards" id="stat-cards"></div>
    </section>

    <section id="bridge" class="bridge hidden">
      <p class="bridge-text" id="bridge-text"></p>
      <a class="bridge-cta hidden" id="bridge-cta" target="_blank" rel="noopener"></a>
    </section>

    <section id="empty-state" class="empty-state hidden">
      <p>Quiet week. No AI tools detected.</p>
    </section>

    <section id="day-list" class="day-list"></section>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
