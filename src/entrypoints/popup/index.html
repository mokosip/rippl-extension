<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>rippl</title>
</head>
<body>
  <div id="app">
    <header class="popup-header">
      <span class="brand-mark"><svg class="brand-icon" width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="3.5" fill="#5C7A52"/><circle cx="16" cy="16" r="8.7" stroke="#5C7A52" stroke-width="2.8" opacity=".65"/><circle cx="16" cy="16" r="14" stroke="#5C7A52" stroke-width="2.2" opacity=".4"/></svg> rippl</span>
      <div class="header-actions">
        <button class="btn-icon" id="btn-history" title="Weekly history"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="10" width="3" height="4" rx="0.5" fill="currentColor" opacity="0.5"/><rect x="6.5" y="6" width="3" height="8" rx="0.5" fill="currentColor" opacity="0.7"/><rect x="11" y="3" width="3" height="11" rx="0.5" fill="currentColor"/></svg></button>
        <button class="btn-icon" id="btn-settings" title="Settings">&#x2699;</button>
      </div>
    </header>

    <div id="state-loading" class="state">
      <p class="loading-text">Loading&hellip;</p>
    </div>

    <div id="state-feedback" class="state hidden">
      <p class="feedback-question" id="feedback-question"></p>
      <div class="feedback-options" id="feedback-options"></div>
      <p class="feedback-error hidden" id="feedback-error"></p>
    </div>

    <div id="state-status" class="state hidden">
      <div class="status-date-row">
        <p class="status-date" id="status-date"></p>
        <button class="btn-toggle" id="btn-toggle-pause" type="button"></button>
      </div>

      <p class="status-line hidden" id="status-line"></p>

      <div class="status-stats hidden" id="status-stats">
        <div class="stat-cell">
          <span class="stat-label">Sessions</span>
          <span class="stat-value" id="status-session-count"></span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Duration</span>
          <span class="stat-value" id="status-duration"></span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Active</span>
          <span class="stat-value" id="status-active"></span>
        </div>
      </div>

      <div class="empty-state hidden" id="status-empty">
        <p>Quiet day. No AI tools detected yet.</p>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
