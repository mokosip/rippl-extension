<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>rippl</title>
</head>
<body>
  <div id="app">

    <!-- State A: Single session micro-prompt -->
    <div id="state-a-prompt" class="state hidden">
      <p class="prompt-headline" id="prompt-headline"></p>

      <label class="section-label">What were you doing?</label>
      <div class="pill-group" id="activity-pills">
        <button class="pill" data-value="Writing">Writing</button>
        <button class="pill" data-value="Code">Code</button>
        <button class="pill" data-value="Research">Research</button>
        <button class="pill" data-value="Creative">Creative</button>
        <button class="pill" data-value="Other">Other</button>
      </div>

      <label class="section-label">Without AI, this would've taken…</label>
      <div class="pill-group" id="time-pills">
        <button class="pill" data-value="same">~same</button>
        <button class="pill" data-value="5">5m</button>
        <button class="pill" data-value="15">15m</button>
        <button class="pill" data-value="30">30m</button>
        <button class="pill" data-value="60">1hr</button>
        <button class="pill" data-value="120">2hr+</button>
      </div>

      <div class="actions">
        <button class="btn-skip" id="btn-skip">Skip</button>
      </div>
    </div>

    <!-- State A: Multi-session list -->
    <div id="state-a-list" class="state hidden">
      <p class="list-headline" id="list-headline"></p>
      <div id="session-list" class="session-list"></div>
      <div class="actions list-actions">
        <button class="btn-primary" id="btn-merge" disabled>Merge selected</button>
        <button class="btn-primary" id="btn-log-each">Log each</button>
      </div>
      <div class="actions">
        <button class="btn-skip" id="btn-skip-all">Skip all</button>
      </div>
    </div>

    <!-- State B: Daily summary -->
    <div id="state-b" class="state hidden">
      <div class="summary-header">
        <span class="brand-mark"><svg class="brand-icon" width="18" height="18" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="3.5" fill="#5C7A52"/><circle cx="16" cy="16" r="8.7" stroke="#5C7A52" stroke-width="2.8" opacity=".65"/><circle cx="16" cy="16" r="14" stroke="#5C7A52" stroke-width="2.2" opacity=".4"/></svg> rippl</span>
        <div class="header-actions">
          <button class="btn-icon" id="btn-settings" title="Settings">&#x2699;</button>
          <button class="btn-icon" id="btn-pause" title="Pause tracking">&#x23F8;</button>
        </div>
      </div>
      <p class="summary-date" id="summary-date"></p>
      <div class="hero" id="hero"></div>
      <div class="seed" id="seed"></div>
      <hr class="divider">
      <div class="stats" id="stats"></div>
      <!-- Paused state -->
      <div class="paused-state hidden" id="paused-state">
        <p>Tracking paused.</p>
        <button class="btn-primary" id="btn-resume">Resume</button>
      </div>
      <!-- Empty state -->
      <div class="empty-state hidden" id="empty-state">
        <p>Quiet day. No AI tools detected yet.</p>
      </div>
    </div>

    <!-- Loading state -->
    <div id="state-loading" class="state">
      <p class="loading-text">Loading&hellip;</p>
    </div>

  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
